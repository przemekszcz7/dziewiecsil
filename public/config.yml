# =====================================================================
# KONFIGURACJA DECAP CMS + DECAPBRIDGE (auth typu "Classic")
# =====================================================================
# 1) Załóż konto na https://decapbridge.com i dodaj swoją stronę (Add a site).
# 2) Jako "Auth type" wybierz: Classic.
# 3) Po utworzeniu strony DecapBridge pokaże Ci gotowy fragment "backend:".
#    PODMIEŃ poniższą sekcję backend na tę, którą dostaniesz od DecapBridge —
#    poniżej jest tylko wzór z wartościami do uzupełnienia.
# =====================================================================

backend:
  name: git-gateway
  repo: TWOJA-NAZWA-UZYTKOWNIKA/NAZWA-REPOZYTORIUM   # np. jankowalski/kapela-dziewiecsil
  branch: main                                        # gałąź, na którą commituje CMS
  identity_url: https://auth.decapbridge.com/sites/TWOJE-SITE-ID   # z panelu DecapBridge
  gateway_url: https://gateway.decapbridge.com                     # z panelu DecapBridge

# Lepsze, czytelne komunikaty commitów w historii repo (opcjonalne, ale polecane)
commit_messages:
  create: 'CMS: dodano "{{slug}}" w kolekcji {{collection}} ({{author-name}})'
  update: 'CMS: zaktualizowano "{{slug}}" w kolekcji {{collection}} ({{author-name}})'
  delete: 'CMS: usunięto "{{slug}}" w kolekcji {{collection}} ({{author-name}})'
  uploadMedia: 'CMS: dodano plik multimedialny ({{author-name}})'
  deleteMedia: 'CMS: usunięto plik multimedialny ({{author-name}})'

# Wyłącza "Editorial Workflow" — zmiany trafiają od razu na branch main,
# a build (GitHub Actions) automatycznie przebudowuje i publikuje stronę.
publish_mode: simple

# Domyślne miejsce, gdzie DecapCMS zapisuje NOWO WGRYWANE zdjęcia.
# Musi być katalog wewnątrz "public", żeby Vite skopiował go 1:1 do builda.
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

locale: "pl"

collections:

  # ---------------------------------------------------------------
  # 1) USTAWIENIA STRONY — podmiana zdjęcia głównego (hero) i logo
  # ---------------------------------------------------------------
  - name: "settings"
    label: "Ustawienia strony"
    files:
      - name: "general"
        label: "Zdjęcia główne (hero i logo)"
        file: "src/content/settings.json"
        fields:
          - { label: "Zdjęcie w tle (sekcja hero)", name: "heroImage", widget: "image", media_library: { config: { multiple: false } } }
          - { label: "Logo (nagłówek i stopka)", name: "logoImage", widget: "image", media_library: { config: { multiple: false } } }

  # ---------------------------------------------------------------
  # 2) GALERIA — dodawanie / usuwanie / zmiana kolejności zdjęć
  # ---------------------------------------------------------------
  - name: "gallery"
    label: "Galeria zdjęć"
    files:
      - name: "gallery"
        label: "Zdjęcia w galerii"
        file: "src/content/gallery.json"
        fields:
          - label: "Zdjęcia"
            name: "items"
            widget: "list"
            label_singular: "Zdjęcie"
            summary: "{{fields.alt}}"
            fields:
              - { label: "Plik zdjęcia", name: "image", widget: "image" }
              - { label: "Opis (tekst alternatywny)", name: "alt", widget: "string", required: false }
